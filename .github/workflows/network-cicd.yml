
name: Network CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "source_of_truth/**"
      - "src/**"
      - "ansible/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/network-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping deployments from competing for the same routers.
concurrency:
  group: network-cicd-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------
  # JOB 1: Validate, test, generate and publish one artifact
  # ---------------------------------------------------------
  ci:
    name: Validate and Build Network Artifact
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, network-cicd]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify required tools
        run: |
          set -Eeuo pipefail
          python --version
          ansible-playbook --version

      - name: Validate Source of Truth and generate configuration
        run: |
          set -Eeuo pipefail
          chmod +x scripts/run_ci.sh
          ./scripts/run_ci.sh

      - name: Check staging playbooks
        run: |
          set -Eeuo pipefail
          ansible-playbook \
            -i generated/inventory/staging.yml \
            ansible/playbooks/backup_staging.yml \
            --syntax-check

          ansible-playbook \
            -i generated/inventory/staging.yml \
            ansible/playbooks/deploy_staging.yml \
            --syntax-check

      - name: Check production playbooks
        run: |
          set -Eeuo pipefail
          ansible-playbook \
            -i generated/inventory/production.yml \
            ansible/playbooks/backup_production.yml \
            --syntax-check

          ansible-playbook \
            -i generated/inventory/production.yml \
            ansible/playbooks/deploy_production.yml \
            --syntax-check

      - name: Verify required artifact files
        run: |
          set -Eeuo pipefail
          test -s generated/configs/R2.cfg
          test -s generated/configs/R3.cfg
          test -s generated/inventory/staging.yml
          test -s generated/inventory/production.yml
          test -s generated/routing_intent.json

      - name: Create artifact checksum manifest
        run: |
          set -Eeuo pipefail
          cd generated
          sha256sum \
            configs/R2.cfg \
            configs/R3.cfg \
            inventory/staging.yml \
            inventory/production.yml \
            routing_intent.json \
            > SHA256SUMS

      - name: Upload validated network configuration artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-config-${{ github.sha }}
          path: |
            generated/configs/R2.cfg
            generated/configs/R3.cfg
            generated/inventory/staging.yml
            generated/inventory/production.yml
            generated/routing_intent.json
            generated/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------
  # JOB 2: Download artifact, back up and deploy to R2
  # ---------------------------------------------------------
  deploy-staging:
    name: Backup, Deploy and Verify Staging
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, network-cicd]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download validated network configuration artifact
        uses: actions/download-artifact@v4
        with:
          name: network-config-${{ github.sha }}
          path: generated

      - name: Verify downloaded artifact
        run: |
          set -Eeuo pipefail

          test -s generated/configs/R2.cfg
          test -s generated/configs/R3.cfg
          test -s generated/inventory/staging.yml
          test -s generated/inventory/production.yml
          test -s generated/routing_intent.json
          test -s generated/SHA256SUMS

          cd generated
          sha256sum -c SHA256SUMS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Backup staging configuration
        env:
          NETWORK_SSH_PASSWORD: ${{ secrets.NETWORK_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${NETWORK_SSH_PASSWORD:?NETWORK_SSH_PASSWORD secret is missing}"

          SECRET_FILE="$(mktemp /tmp/network-cicd-secrets.XXXXXX.yml)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          export SECRET_FILE

          python - <<'PY'
          import os
          import yaml

          with open(os.environ["SECRET_FILE"], "w") as f:
              yaml.safe_dump(
                  {"ansible_password": os.environ["NETWORK_SSH_PASSWORD"]},
                  f
              )
          PY

          ansible-playbook \
            ansible/playbooks/backup_staging.yml \
            -i generated/inventory/staging.yml \
            -u ccna -e "@${SECRET_FILE}"

      - name: Deploy and verify staging
        env:
          NETWORK_SSH_PASSWORD: ${{ secrets.NETWORK_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${NETWORK_SSH_PASSWORD:?NETWORK_SSH_PASSWORD secret is missing}"

          SECRET_FILE="$(mktemp /tmp/network-cicd-secrets.XXXXXX.yml)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          export SECRET_FILE

          python - <<'PY'
          import os
          import yaml

          with open(os.environ["SECRET_FILE"], "w") as f:
              yaml.safe_dump(
                  {"ansible_password": os.environ["NETWORK_SSH_PASSWORD"]},
                  f
              )
          PY

          ansible-playbook \
            ansible/playbooks/deploy_staging.yml \
            -i generated/inventory/staging.yml \
            -u ccna -e "@${SECRET_FILE}"

  # ---------------------------------------------------------
  # JOB 3: Wait for approval, then deploy the same artifact
  #        to R3 only after staging succeeds
  # ---------------------------------------------------------
  deploy-production:
    name: Approved Production Deployment
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, network-cicd]
    timeout-minutes: 20

    # Configure required reviewers under GitHub Settings > Environments.
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download validated network configuration artifact
        uses: actions/download-artifact@v4
        with:
          name: network-config-${{ github.sha }}
          path: generated

      - name: Verify downloaded artifact
        run: |
          set -Eeuo pipefail

          test -s generated/configs/R2.cfg
          test -s generated/configs/R3.cfg
          test -s generated/inventory/staging.yml
          test -s generated/inventory/production.yml
          test -s generated/routing_intent.json
          test -s generated/SHA256SUMS

          cd generated
          sha256sum -c SHA256SUMS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Backup production configuration
        env:
          NETWORK_SSH_PASSWORD: ${{ secrets.NETWORK_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${NETWORK_SSH_PASSWORD:?NETWORK_SSH_PASSWORD secret is missing}"

          SECRET_FILE="$(mktemp /tmp/network-cicd-secrets.XXXXXX.yml)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          export SECRET_FILE

          python - <<'PY'
          import os
          import yaml

          with open(os.environ["SECRET_FILE"], "w") as f:
              yaml.safe_dump(
                  {"ansible_password": os.environ["NETWORK_SSH_PASSWORD"]},
                  f
              )
          PY

          ansible-playbook \
            ansible/playbooks/backup_production.yml \
            -i generated/inventory/production.yml \
            -u ccna -e "@${SECRET_FILE}"

      - name: Deploy and verify production
        env:
          NETWORK_SSH_PASSWORD: ${{ secrets.NETWORK_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${NETWORK_SSH_PASSWORD:?NETWORK_SSH_PASSWORD secret is missing}"

          SECRET_FILE="$(mktemp /tmp/network-cicd-secrets.XXXXXX.yml)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          export SECRET_FILE

          python - <<'PY'
          import os
          import yaml

          with open(os.environ["SECRET_FILE"], "w") as f:
              yaml.safe_dump(
                  {"ansible_password": os.environ["NETWORK_SSH_PASSWORD"]},
                  f
              )
          PY

          ansible-playbook \
            ansible/playbooks/deploy_production.yml \
            -i generated/inventory/production.yml \
            -u ccna -e "@${SECRET_FILE}"
