
name: Network CD

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Successful Network CI workflow run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: network-cicd-deployment
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------
  # JOB 1: Verify selected CI run before deployment
  # ---------------------------------------------------------
  validate-ci:
    name: Validate Selected CI Run
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      head_sha: ${{ steps.verify.outputs.head_sha }}

    steps:
      - name: Verify CI run status and source commit
        id: verify
        uses: actions/github-script@v7
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        with:
          script: |
            const runId = Number(process.env.CI_RUN_ID);

            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed("Invalid CI run ID.");
              return;
            }

            // Allow only the authorized GitHub account
            if (context.actor !== "13keshab") {
              core.setFailed(
                "Unauthorized: Only 13keshab can start Network CD."
              );
              return;
            }

            // CD must be triggered from main
            if (context.ref !== "refs/heads/main") {
              core.setFailed(
                "CD must be started from the main branch."
              );
              return;
            }

            // Retrieve the selected CI workflow run
            const response = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            const run = response.data;

            // Confirm that the selected run belongs to Network CI
            if (
              run.path.split("@")[0] !==
              ".github/workflows/network-ci.yml"
            ) {
              core.setFailed(
                "Selected run is not from Network CI."
              );
              return;
            }

            // Confirm that CI completed successfully on main
            if (
              run.event !== "push" ||
              run.head_branch !== "main" ||
              run.status !== "completed" ||
              run.conclusion !== "success"
            ) {
              core.setFailed(
                "Selected CI run must be a successful push workflow on main."
              );
              return;
            }

            // Export the exact CI commit SHA
            core.setOutput("head_sha", run.head_sha);

            core.info(`Verified CI run: ${run.id}`);
            core.info(`Source branch: ${run.head_branch}`);
            core.info(`Source commit: ${run.head_sha}`);

  # ---------------------------------------------------------
  # JOB 2: Download exact CI artifact and deploy to R2
  # ---------------------------------------------------------
  deploy-staging:
    name: Backup, Deploy and Verify Staging
    needs: validate-ci
    runs-on: [self-hosted, linux, x64, network-cicd]
    timeout-minutes: 20

    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-ci.outputs.head_sha }}

      - name: Download validated CI artifact
        uses: actions/download-artifact@v4
        with:
          name: network-config-${{ needs.validate-ci.outputs.head_sha }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: generated

      - name: Verify downloaded artifact
        run: |
          set -Eeuo pipefail

          test -s generated/configs/R2.cfg
          test -s generated/configs/R3.cfg
          test -s generated/inventory/staging.yml
          test -s generated/inventory/production.yml
          test -s generated/routing_intent.json
          test -s generated/SHA256SUMS

          cd generated
          sha256sum -c SHA256SUMS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Backup staging configuration
        env:
          NETWORK_SSH_PASSWORD: ${{ secrets.NETWORK_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${NETWORK_SSH_PASSWORD:?NETWORK_SSH_PASSWORD secret is missing}"

          SECRET_FILE="$(mktemp /tmp/network-cicd-secrets.XXXXXX.yml)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          export SECRET_FILE

          python - <<'PY'
          import os
          import yaml

          with open(os.environ["SECRET_FILE"], "w") as f:
              yaml.safe_dump(
                  {"ansible_password": os.environ["NETWORK_SSH_PASSWORD"]},
                  f
              )
          PY

          ansible-playbook \
            ansible/playbooks/backup_staging.yml \
            -i generated/inventory/staging.yml \
            -u ccna -e "@${SECRET_FILE}"

      - name: Deploy and verify staging
        env:
          NETWORK_SSH_PASSWORD: ${{ secrets.NETWORK_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${NETWORK_SSH_PASSWORD:?NETWORK_SSH_PASSWORD secret is missing}"

          SECRET_FILE="$(mktemp /tmp/network-cicd-secrets.XXXXXX.yml)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          export SECRET_FILE

          python - <<'PY'
          import os
          import yaml

          with open(os.environ["SECRET_FILE"], "w") as f:
              yaml.safe_dump(
                  {"ansible_password": os.environ["NETWORK_SSH_PASSWORD"]},
                  f
              )
          PY

          ansible-playbook \
            ansible/playbooks/deploy_staging.yml \
            -i generated/inventory/staging.yml \
            -u ccna -e "@${SECRET_FILE}"

  # ---------------------------------------------------------
  # JOB 3: Require production environment protection
  #        and deploy to R3 after staging succeeds
  # ---------------------------------------------------------
  deploy-production:
    name: Approved Production Deployment
    needs:
      - validate-ci
      - deploy-staging
    runs-on: [self-hosted, linux, x64, network-cicd]
    timeout-minutes: 20

    environment: production

    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-ci.outputs.head_sha }}

      - name: Download the same validated CI artifact
        uses: actions/download-artifact@v4
        with:
          name: network-config-${{ needs.validate-ci.outputs.head_sha }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: generated

      - name: Verify downloaded artifact
        run: |
          set -Eeuo pipefail

          test -s generated/configs/R2.cfg
          test -s generated/configs/R3.cfg
          test -s generated/inventory/staging.yml
          test -s generated/inventory/production.yml
          test -s generated/routing_intent.json
          test -s generated/SHA256SUMS

          cd generated
          sha256sum -c SHA256SUMS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Backup production configuration
        env:
          NETWORK_SSH_PASSWORD: ${{ secrets.NETWORK_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${NETWORK_SSH_PASSWORD:?NETWORK_SSH_PASSWORD secret is missing}"

          SECRET_FILE="$(mktemp /tmp/network-cicd-secrets.XXXXXX.yml)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          export SECRET_FILE

          python - <<'PY'
          import os
          import yaml

          with open(os.environ["SECRET_FILE"], "w") as f:
              yaml.safe_dump(
                  {"ansible_password": os.environ["NETWORK_SSH_PASSWORD"]},
                  f
              )
          PY

          ansible-playbook \
            ansible/playbooks/backup_production.yml \
            -i generated/inventory/production.yml \
            -u ccna -e "@${SECRET_FILE}"

      - name: Deploy and verify production
        env:
          NETWORK_SSH_PASSWORD: ${{ secrets.NETWORK_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${NETWORK_SSH_PASSWORD:?NETWORK_SSH_PASSWORD secret is missing}"

          SECRET_FILE="$(mktemp /tmp/network-cicd-secrets.XXXXXX.yml)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          export SECRET_FILE

          python - <<'PY'
          import os
          import yaml

          with open(os.environ["SECRET_FILE"], "w") as f:
              yaml.safe_dump(
                {"ansible_password": os.environ["NETWORK_SSH_PASSWORD"]},
                f
              )
          PY

          ansible-playbook \
            ansible/playbooks/deploy_production.yml \
            -i generated/inventory/production.yml \
            -u ccna -e "@${SECRET_FILE}"
